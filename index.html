<title>Tế bào nhân thực</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Bố cục: hero viền đen mờ dần sang trắng; nội dung trên nền be sáng; trang bộ phận 2 cột (hình | cấu tạo, chức năng) */
:root{
  --bg:#f3e9d2;          /* be sáng - nền toàn trang */
  --panel:#faf4e4;       /* be nhạt hơn - khối nội dung */
  --panel2:#ede1c3;      /* be đậm - tiêu đề bảng, chip */
  --line:#d9caa4;
  --ink:#2b2217;
  --ink2:#6b5b44;
  --accent:#8a4b12;
  --good:#2f7d4f;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;margin:0}
img{max-width:100%;display:block}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- nút cố định ---------- */
.fab{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 12px);font-family:var(--font)}
#editBtn{right:max(14px,env(safe-area-inset-right,0px));background:#fff;color:#111;border:2px solid #111;border-radius:999px;padding:7px 18px;font-weight:700;font-size:15px;cursor:pointer;display:flex;gap:8px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#editBtn:hover{background:#111;color:#fff}
body.editing #editBtn{background:var(--good);border-color:var(--good);color:#fff}
#backBtn{left:max(14px,env(safe-area-inset-left,0px));width:48px;height:48px;border-radius:50%;border:2px solid var(--ink);background:var(--ink);color:#fff;font-size:26px;font-weight:700;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0 3px 3px 0;box-shadow:0 2px 10px rgba(0,0,0,.25);font-family:var(--font)}
#backBtn:hover{background:#fff;color:var(--ink)}
body.inpart #backBtn{display:flex}
:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}

/* ---------- hero ---------- */
.hero{position:relative;min-height:clamp(320px,56vh,540px);display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:10px;
  background:radial-gradient(ellipse 78% 100% at 50% 50%,#fff 60%,#9a9a9a 86%,#000 100%);
  padding-top:calc(env(safe-area-inset-top,0px) + 56px);padding-bottom:36px;padding-left:max(5vw,env(safe-area-inset-left,0px));padding-right:max(5vw,env(safe-area-inset-right,0px))}
.hero .kick{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#555;font-weight:600;margin-bottom:10px}
.hero h1{font-size:clamp(38px,6.2vw,84px);font-weight:800;color:#0b0b0b;letter-spacing:-.02em}
.hero .imgwrap{justify-self:end;width:100%;max-width:620px}
.hero img{width:100%;-webkit-mask-image:radial-gradient(ellipse 62% 64% at 50% 50%,#000 40%,transparent 100%);mask-image:radial-gradient(ellipse 62% 64% at 50% 50%,#000 40%,transparent 100%)}
@media(max-width:700px){.hero{grid-template-columns:1fr;padding-top:calc(env(safe-area-inset-top,0px) + 64px)}.hero .imgwrap{justify-self:center}}

/* ---------- khối nội dung ---------- */
main{padding-block:28px 90px}
.block{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,32px);margin-top:26px}
.block h2{font-size:clamp(22px,3vw,30px);font-weight:800;margin-bottom:14px}
.block h3{font-size:18px;font-weight:700;margin:20px 0 8px}
ul{margin:6px 0 6px;padding-left:1.25em}
li{margin:4px 0}
li::marker{color:var(--accent)}
ul ul{list-style:circle}
.hint{color:var(--ink2);font-size:14px;margin:0 0 10px}

/* ---------- mô hình tế bào ---------- */
.stage-scroll{overflow-x:auto;border-radius:12px}
.stage{position:relative;width:100%;min-width:720px;container-type:inline-size;background:#fff;border-radius:12px;overflow:hidden;user-select:none;-webkit-user-select:none}
.stage .base{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.stage .dim{position:absolute;inset:0;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px);opacity:0;transition:opacity .22s;pointer-events:none}
.stage.act .dim{opacity:1}
.zoomwrap{position:absolute;inset:0;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.38))}
.zoom{position:absolute;inset:0;background-size:100% 100%;transition:transform .24s cubic-bezier(.2,.8,.3,1);transform:scale(1)}
.zoom.on{transform:scale(var(--z,1.1))}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.hit path{fill:transparent;cursor:pointer;pointer-events:all}
body.editing .hit path{cursor:default}
.lines{pointer-events:none}
.lines line{stroke:#1b1b1b;stroke-width:1.7;transition:stroke .15s,stroke-width .15s}
.lines circle{fill:#1b1b1b}
.lines .on{stroke:var(--accent);stroke-width:2.6}
.lines circle.on{fill:var(--accent)}
.lab{position:absolute;transform:translate(-50%,-50%);font-size:max(11px,1.85cqw);font-weight:600;line-height:1.2;white-space:nowrap;padding:.38em .85em;border-radius:.65em;border:.1em solid var(--bd);background:var(--bg2);color:#1c1530;cursor:pointer;transition:transform .15s,box-shadow .15s;outline-offset:3px}
.lab.on,.lab:focus-visible{transform:translate(-50%,-50%) scale(1.09);box-shadow:0 4px 14px rgba(0,0,0,.28)}
body.editing .lab{cursor:text}
.extra{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.extra b{font-size:14px;color:var(--ink2);margin-right:4px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);font-family:var(--font)}
.chip:hover{background:var(--ink);color:#fff}

/* ---------- bảng ---------- */
.tblwrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;min-width:560px;background:var(--panel)}
th,td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
th{background:var(--panel2);font-weight:700}
tbody td:first-child{font-weight:600;white-space:nowrap}
td ul{margin:0}
.figpair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.figpair figure,.fig{margin:0}
.figpair img,.fig img{width:100%;border-radius:10px;background:#fff;border:1px solid var(--line)}
figcaption{font-size:13px;color:var(--ink2);text-align:center;margin-top:6px}
@media(max-width:760px){.figpair{grid-template-columns:1fr}}
.tbtools{display:none;gap:8px;margin:6px 0}
body.editing .tbtools{display:flex}
.tbtools button,.tb button{font-family:var(--font)}

/* ---------- trang bộ phận ---------- */
#partView{display:none}
body.inpart #partView{display:block}
body.inpart #homeView{display:none}
.phead{padding:calc(env(safe-area-inset-top,0px) + 76px) 0 6px}
.crumb{font-size:13px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-bottom:8px}
.phead h1{font-size:clamp(28px,4.6vw,48px);font-weight:800;letter-spacing:-.015em}
.where{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tag{font-size:12.5px;font-weight:700;padding:3px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2)}
.pgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;margin-top:22px;align-items:start}
@media(max-width:860px){.pgrid{grid-template-columns:1fr}}
.pfig{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.pfig img{width:100%;border-radius:8px;background:#fff}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 22px;margin-bottom:16px}
.sec h3{font-size:19px;font-weight:800;color:var(--accent);margin:0 0 6px}
.sec .fig{margin-top:12px}
.comps{margin-top:26px}
.comp{border:1px solid var(--line);background:var(--panel);border-radius:12px;margin-bottom:10px;overflow:hidden}
.comp.l1{margin-left:clamp(14px,4vw,40px)}
.chead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;cursor:pointer;font-weight:700;font-size:16.5px}
.chead:hover{background:var(--panel2)}
.chead i{flex:none;width:11px;height:11px;border-right:3px solid var(--accent);border-bottom:3px solid var(--accent);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
.comp.open .chead i{transform:rotate(-135deg) translate(-2px,-2px)}
.cbody{padding:2px 18px 14px;color:#3a2e20}
.cbody p{margin:0}
body.editing .cbody[hidden]{display:block!important}
body.editing .chead{cursor:text}
body:not(.editing)[data-ctx="dongvat"] [data-only="thucvat"],
body:not(.editing)[data-ctx="thucvat"] [data-only="dongvat"]{display:none!important}
body.editing [data-only]{outline:1px dashed #b08a3a;outline-offset:2px}

/* ---------- chế độ chỉnh sửa ---------- */
body.editing [contenteditable="true"]{outline:1px dashed rgba(138,75,18,.55);outline-offset:2px;border-radius:3px;cursor:text}
body.editing [contenteditable="true"]:focus{outline:2px solid #1a73e8;background:rgba(255,255,255,.55)}
.imgwrap{position:relative}
.chg{display:none;position:absolute;right:10px;bottom:10px;background:#1a73e8;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-family:var(--font);z-index:3}
body.editing .chg{display:block}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#17130d;color:#fff;display:none;gap:10px;align-items:center;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font-size:14px}
body.editing #bar{display:flex}
#bar span{flex:1 1 260px;opacity:.9}
#bar button{font-family:var(--font);background:#fff;color:#111;border:0;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer}
#bar button.warn{background:#ffd9d4;color:#7a1408}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:10px;z-index:70;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw}
#toast.show{opacity:1}
.tb{display:none}
body.editing .tb{display:flex;gap:8px;margin:6px 0}
.tb button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-weight:600;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

function persist(){try{localStorage.setItem(LS_KEY,JSON.stringify(EDITS));return true}catch(e){toast('Không lưu được (bộ nhớ trình duyệt đầy hoặc bị chặn). Hãy tải edits.json để giữ thay đổi.');return false}}
function setEdit(k,v){EDITS[k]=v;clearTimeout(saveTimer);saveTimer=setTimeout(persist,250)}
function T(k,d){return (k in EDITS)?EDITS[k]:d}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function E(k,d,tag,cls,extra){return `<${tag||'div'} class="${cls||''}" data-e="${k}" ${extra||''}>${T(k,d)}</${tag||'div'}>`}
function ET(k,d,tag,cls,extra){return `<${tag||'span'} class="${cls||''}" data-et="${k}" ${extra||''}>${esc(T(k,d))}</${tag||'span'}>`}
function IMG(k,src,alt,cls){return `<div class="imgwrap ${cls||''}"><img data-img="${k}" src="${T(k,src)}" alt="${esc(alt||'')}"><button type="button" class="chg" data-chg="${k}">Đổi ảnh</button></div>`}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3200)}

function TABLE(key,head,rows){
  const bodyDefault=rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('');
  return `<div class="tblwrap"><table data-tbl="${key}"><thead><tr>${head.map((h,i)=>`<th data-et="tbl.${key}.h${i}">${esc(T('tbl.'+key+'.h'+i,h))}</th>`).join('')}</tr></thead><tbody data-eb="tbl.${key}">${T('tbl.'+key,bodyDefault)}</tbody></table></div>
  <div class="tb"><button type="button" data-addrow="${key}">+ Thêm hàng</button><button type="button" data-delrow="${key}">− Xóa hàng cuối</button></div>`;
}

function stageHTML(ck){
  const C=CELLS[ck],H=HOT[ck];
  const paths=C.order.map(id=>{const insts=H.parts[id]||[];return `<g data-h="${id}" tabindex="-1">${insts.map(inst=>`<path fill-rule="evenodd" d="${inst.map(r=>'M'+r.map(p=>p.join(' ')).join('L')+'Z').join('')}"/>`).join('')}</g>`}).join('');
  const labs=C.labels.map(l=>{const [bg,bd]=l.c.split('|');
    return `<span class="lab" role="link" tabindex="0" data-h="${l.h}" data-go="${l.go}" data-open="${l.open||''}" data-et="lab.${ck}.${l.h}" style="left:${l.x/H.w*100}%;top:${l.y/H.h*100}%;--bg2:#${bg};--bd:#${bd}">${esc(T('lab.'+ck+'.'+l.h,l.t))}</span>`}).join('');
  return `<div class="stage-scroll"><div class="stage" data-cell="${ck}" style="aspect-ratio:${H.w}/${H.h}">
   <img class="base" src="${C.img}" alt="${C.name}"><div class="dim"></div><div class="zoomwrap"></div>
   <svg class="hit" viewBox="0 0 ${H.w} ${H.h}" preserveAspectRatio="none">${paths}</svg>
   <svg class="lines"></svg>${labs}</div></div>`;
}

/* ---- vẽ nét chỉ & hiệu ứng phóng to ---- */
function layoutStage(st){
  const ck=st.dataset.cell,H=HOT[ck],C=CELLS[ck],W=st.clientWidth,Hh=st.clientHeight;if(!W)return;
  const svg=st.querySelector('.lines');svg.setAttribute('viewBox',`0 0 ${W} ${Hh}`);
  let s='';
  C.labels.forEach(l=>{const el=st.querySelector(`.lab[data-h="${l.h}"]`);const cx=l.x/H.w*W,cy=l.y/H.h*Hh,w=el.offsetWidth,h=el.offsetHeight;
    let sx=cx,sy=cy;if(l.s==='r')sx=cx+w/2;else if(l.s==='l')sx=cx-w/2;else if(l.s==='b')sy=cy+h/2;else sy=cy-h/2;
    const ax=l.ax/H.w*W,ay=l.ay/H.h*Hh;
    s+=`<line data-h="${l.h}" x1="${sx}" y1="${sy}" x2="${ax}" y2="${ay}"/><circle data-h="${l.h}" cx="${ax}" cy="${ay}" r="${Math.max(3,W/380)}"/>`});
  svg.innerHTML=s;
}
let actTimer=0;
function activate(st,h){
  clearTimeout(actTimer);
  const ck=st.dataset.cell,H=HOT[ck],C=CELLS[ck],W=st.clientWidth,Hh=st.clientHeight,k=W/H.w;
  const wrap=st.querySelector('.zoomwrap');wrap.innerHTML='';
  (H.parts[h]||[]).forEach(inst=>{
    const d=document.createElement('div');d.className='zoom';
    let xs=[],ys=[];const path=inst.map(r=>{r.forEach(p=>{xs.push(p[0]);ys.push(p[1])});return 'M'+r.map(p=>(p[0]*k).toFixed(1)+' '+(p[1]*k).toFixed(1)).join('L')+'Z'}).join('');
    d.style.clipPath=`path(evenodd,'${path}')`;d.style.backgroundImage=`url("${C.img}")`;
    const cx=(Math.min(...xs)+Math.max(...xs))/2*k,cy=(Math.min(...ys)+Math.max(...ys))/2*k;
    d.style.transformOrigin=`${cx}px ${cy}px`;d.style.setProperty('--z',C.z[h]||1.1);wrap.appendChild(d)});
  st.classList.add('act');
  st.querySelectorAll('[data-h]').forEach(e=>{if(e.dataset.h===h&&(e.classList.contains('lab')||e.tagName==='line'||e.tagName==='circle'))e.classList.add('on')});
  requestAnimationFrame(()=>requestAnimationFrame(()=>wrap.querySelectorAll('.zoom').forEach(z=>z.classList.add('on'))));
}
function deactivate(st){
  st.classList.remove('act');st.querySelectorAll('.on').forEach(e=>{if(!e.classList.contains('zoom'))e.classList.remove('on')});
  st.querySelectorAll('.zoom').forEach(z=>z.classList.remove('on'));
  const wrap=st.querySelector('.zoomwrap');clearTimeout(actTimer);actTimer=setTimeout(()=>{if(!st.classList.contains('act'))wrap.innerHTML=''},280);
}

function renderPart(id,ctx,openKey){
  const p=PARTS[id];const el=document.getElementById('partView');
  const secs=p.secs.map((s,i)=>{const k=`p.${id}.s${i}`;
    return `<section class="sec" ${s.only?`data-only="${s.only}"`:''}>${ET(k+'.h',s.h,'h3')}${s.html?E(k+'.b',s.html,'div','rich'):''}${s.table?TABLE(id+'_'+s.table.key,s.table.head,s.table.rows):''}${s.img?`<figure class="fig">${IMG(k+'.img',s.img,s.cap)}<figcaption>${ET(k+'.cap',s.cap||'')}</figcaption></figure>`:''}</section>`}).join('');
  const comps=p.comps.map(c=>{const k=`p.${id}.c.${c.k}`;
    return `<div class="comp ${c.l?'l1':''}" data-ck="${c.k}" ${c.only?`data-only="${c.only}"`:''}><div class="chead" role="button" tabindex="0" aria-expanded="false">${ET(k+'.n',c.n)}<i></i></div><div class="cbody" hidden>${E(k+'.t',c.t,'p')}</div></div>`}).join('');
  el.innerHTML=`<div class="wrap"><div class="phead"><div class="crumb">${ET('crumb','Tế bào nhân thực · Cấu tạo và chức năng')}</div>${E('p.'+id+'.title',p.title,'h1')}
   <div class="where">${p.in.map(x=>`<span class="tag">${IN_LABEL[x]}</span>`).join('')}</div></div>
   <div class="pgrid">${p.img?`<div class="pfig">${IMG('p.'+id+'.img',p.img,p.title)}<figcaption>${ET('p.'+id+'.cap',p.cap)}</figcaption></div>`:''}<div>${secs}</div></div>
   ${p.comps.length?`<section class="comps"><h2 style="font-size:24px;font-weight:800">${ET('comps.h','Các thành phần cấu tạo')}</h2><p class="hint">${ET('comps.hint','Nhấp vào tên thành phần để xem cấu tạo, chức năng. Nhấp thêm lần nữa để ẩn.','span')}</p>${comps}</section>`:''}
   <div style="height:70px"></div></div>`;
  setEditable(el,editing);
  if(openKey){const c=el.querySelector(`.comp[data-ck="${openKey}"]`);if(c){toggleComp(c,true);setTimeout(()=>c.scrollIntoView({block:'center',behavior:'smooth'}),120)}}
}
function toggleComp(c,force){if(editing)return;const open=force??!c.classList.contains('open');c.classList.toggle('open',open);c.querySelector('.chead').setAttribute('aria-expanded',open);c.querySelector('.cbody').hidden=!open}

let homeY=0,fromHome=false,pendingOpen='',lastCtx='';
function parseHash(){const h=location.hash.slice(1)||'home';const m=h.match(/^([a-z0-9]+)(?:-(dongvat|thucvat))?$/);return m?{id:m[1],ctx:m[2]||''}:{id:'home',ctx:''}}
function route(){
  const {id,ctx}=parseHash();
  if(id==='home'||!PARTS[id]){document.body.classList.remove('inpart');document.body.dataset.ctx='';requestAnimationFrame(()=>{window.scrollTo(0,homeY);document.querySelectorAll('.stage').forEach(layoutStage)});return}
  if(!document.body.classList.contains('inpart'))homeY=window.scrollY;
  document.body.classList.add('inpart');document.body.dataset.ctx=ctx||'all';
  renderPart(id,ctx,pendingOpen);pendingOpen='';window.scrollTo(0,0);
}
function goPart(id,ctx,open){pendingOpen=open||'';fromHome=true;homeY=window.scrollY;location.hash=id+(ctx?'-'+ctx:'')}
window.addEventListener('hashchange',route);

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#editBtn')){setEditing(!editing);return}
  if(t.closest('#backBtn')){if(fromHome){fromHome=false;history.back()}else location.hash='home';return}
  if(t.closest('[data-chg]')){const k=t.closest('[data-chg]').dataset.chg;pickImage(k);return}
  if(t.closest('[data-addrow]')){tableRow(t.closest('[data-addrow]').dataset.addrow,1);return}
  if(t.closest('[data-delrow]')){tableRow(t.closest('[data-delrow]').dataset.delrow,-1);return}
  if(editing)return;
  const chip=t.closest('.chip[data-go]');if(chip){goPart(chip.dataset.go,chip.dataset.ctx);return}
  const lab=t.closest('.lab');if(lab){goPart(lab.dataset.go,lab.closest('.stage').dataset.cell,lab.dataset.open);return}
  const g=t.closest('.hit g');if(g){const st=g.closest('.stage');const l=CELLS[st.dataset.cell].labels.find(x=>x.h===g.dataset.h);if(l)goPart(l.go,st.dataset.cell,l.open);return}
  const ch=t.closest('.chead');if(ch)toggleComp(ch.parentElement);
});
document.addEventListener('keydown',e=>{
  if(editing)return;
  if(e.key==='Enter'||e.key===' '){
    const lab=e.target.closest&&e.target.closest('.lab');if(lab){e.preventDefault();goPart(lab.dataset.go,lab.closest('.stage').dataset.cell,lab.dataset.open);return}
    const ch=e.target.closest&&e.target.closest('.chead');if(ch){e.preventDefault();toggleComp(ch.parentElement)}}
});
/* hover / focus trên mô hình */
document.addEventListener('mouseover',e=>{
  if(editing||document.body.classList.contains('inpart'))return;
  const el=e.target.closest&&e.target.closest('.hit g, .lab');if(!el){return}
  const st=el.closest('.stage');if(st.dataset.cur===el.dataset.h)return;st.dataset.cur=el.dataset.h;activate(st,el.dataset.h)});
document.addEventListener('mouseout',e=>{
  const el=e.target.closest&&e.target.closest('.hit g, .lab');if(!el)return;
  const to=e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.hit g, .lab');
  if(to&&to.dataset.h===el.dataset.h)return;
  const st=el.closest('.stage');st.dataset.cur='';deactivate(st)});
document.addEventListener('focusin',e=>{const l=e.target.closest&&e.target.closest('.lab');if(l&&!editing){const st=l.closest('.stage');activate(st,l.dataset.h)}});
document.addEventListener('focusout',e=>{const l=e.target.closest&&e.target.closest('.lab');if(l){deactivate(l.closest('.stage'))}});
let rsT=0;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>document.querySelectorAll('.stage').forEach(layoutStage),80)});

/* ---- ghi nhận chỉnh sửa ---- */
document.addEventListener('input',e=>{
  const t=e.target;if(!editing||!t.closest)return;
  const a=t.closest('[data-e]');if(a){setEdit(a.dataset.e,a.innerHTML);return}
  const b=t.closest('[data-et]');if(b){setEdit(b.dataset.et,b.textContent);if(b.classList.contains('lab'))layoutStage(b.closest('.stage'));return}
  const c=t.closest('[data-eb]');if(c){setEdit(c.dataset.eb,c.innerHTML)}
});
document.addEventListener('paste',e=>{
  if(!editing)return;const t=e.target.closest&&e.target.closest('[contenteditable="true"]');if(!t)return;
  e.preventDefault();const txt=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,txt)});
document.addEventListener('keydown',e=>{
  if(!editing)return;const t=e.target;
  if(e.key==='Enter'&&t.closest&&t.closest('[data-et]')){e.preventDefault();t.blur()}
  if((e.key===' '||e.key==='Enter')&&t.closest&&t.closest('.chead')&&e.key===' '){e.stopPropagation()}
},true);

function setEditable(root,on){
  root.querySelectorAll('[data-e],[data-et],[data-eb] td').forEach(n=>{if(on)n.setAttribute('contenteditable','true');else n.removeAttribute('contenteditable')});
  root.querySelectorAll('[data-eb]').forEach(n=>n.removeAttribute('contenteditable'));
  root.querySelectorAll('.lab').forEach(n=>{if(on)n.setAttribute('contenteditable','true')});
}
function setEditing(on){
  editing=on;document.body.classList.toggle('editing',on);
  document.getElementById('editTxt').textContent=on?'Xong':'Edit';document.getElementById('editIco').textContent=on?'✓':'✎';
  document.getElementById('editBtn').setAttribute('aria-pressed',on);
  setEditable(document.getElementById('homeView'),on);setEditable(document.getElementById('partView'),on);
  document.querySelectorAll('.comp').forEach(c=>{if(!on){c.classList.remove('open');c.querySelector('.cbody').hidden=true}});
  if(on){document.querySelectorAll('.stage').forEach(st=>{st.dataset.cur='';deactivate(st)});toast('Đã bật chế độ chỉnh sửa')}else{persist();toast('Đã lưu thay đổi')}
}
function tableRow(key,dir){
  const tb=document.querySelector(`table[data-tbl="${key}"] tbody`);if(!tb)return;
  if(dir>0){const last=tb.querySelector('tr:last-child');const tr=document.createElement('tr');const n=last?last.children.length:3;for(let i=0;i<n;i++){const td=document.createElement('td');td.textContent='…';td.setAttribute('contenteditable','true');tr.appendChild(td)}tb.appendChild(tr)}
  else if(tb.rows.length>1)tb.deleteRow(-1);
  setEdit(tb.dataset.eb,tb.innerHTML);
}
function pickImage(key){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,1300/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    const url=c.toDataURL('image/jpeg',.86);document.querySelectorAll(`img[data-img="${key}"]`).forEach(i=>i.src=url);setEdit(key,url);toast('Đã đổi ảnh')};im.src=fr.result};fr.readAsDataURL(f)};
  inp.click();
}

document.getElementById('bImport').onclick=()=>{
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;f.text().then(t=>{try{EDITS=JSON.parse(t);persist();rerender();toast('Đã nhập chỉnh sửa')}catch(e){toast('File JSON không hợp lệ')}})};inp.click()};
let resetArm=0;
document.getElementById('bReset').onclick=function(){
  if(!resetArm){resetArm=1;this.textContent='Bấm lần nữa để xóa mọi chỉnh sửa';setTimeout(()=>{resetArm=0;this.textContent='Khôi phục bản gốc'},4000);return}
  resetArm=0;this.textContent='Khôi phục bản gốc';EDITS={};try{localStorage.removeItem(LS_KEY)}catch(e){}rerender();toast('Đã khôi phục nội dung gốc')};
function rerender(){renderHome();const {id,ctx}=parseHash();if(PARTS[id])renderPart(id,ctx)}

/* ---- khởi động ---- */
(async function init(){
  try{const r=await fetch('edits.json',{cache:'no-cache'});if(r.ok)BASE=await r.json()}catch(e){}
  EDITS=Object.assign({},BASE,lsGet());
  renderHome();route();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>document.querySelectorAll('.stage').forEach(layoutStage));
})();
</script>

</body></html>
